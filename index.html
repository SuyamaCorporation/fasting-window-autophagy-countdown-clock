<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>断食ウィンドウ・オートファジーカウントダウン</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4">
<div class="w-full max-w-lg">
  <h1 class="text-2xl font-bold text-teal-400 text-center mb-1">断食ウィンドウ</h1>
  <p class="text-slate-400 text-center text-sm mb-6">オートファジー開始カウントダウン</p>

  <div class="bg-slate-800 rounded-2xl p-6 mb-4">
    <label class="block text-slate-300 text-sm mb-1" for="last-meal">最後の食事時刻</label>
    <input type="datetime-local" id="last-meal" class="w-full bg-slate-700 text-white rounded-lg p-3 border border-slate-600 focus:border-teal-400 outline-none" aria-label="最後の食事時刻">
    <div class="flex gap-2 mt-3">
      <button onclick="startFast()" class="flex-1 bg-teal-600 hover:bg-teal-500 text-white py-2 rounded-lg font-bold transition">計測開始</button>
      <button onclick="stopFast()" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white py-2 rounded-lg font-bold transition">リセット</button>
    </div>
  </div>

  <div class="bg-slate-800 rounded-2xl p-4 mb-4">
    <label class="block text-slate-300 text-sm mb-2" for="mode-select">断食モード</label>
    <select id="mode-select" onchange="updateMode()" class="w-full bg-slate-700 text-white rounded-lg p-2 border border-slate-600 outline-none" aria-label="断食モード">
      <option value="16">16:8（16時間断食）</option>
      <option value="18">18:6（18時間断食）</option>
      <option value="24">OMAD（24時間断食）</option>
    </select>
  </div>

  <div id="display" class="hidden">
    <div class="bg-slate-800 rounded-2xl p-6 mb-4 text-center">
      <p class="text-slate-400 text-sm mb-1">断食継続時間</p>
      <div id="elapsed" class="text-5xl font-mono font-bold text-teal-300">00:00:00</div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-slate-800 rounded-xl p-4 text-center">
        <p class="text-slate-400 text-xs mb-1">オートファジー開始まで</p>
        <div id="auto-countdown" class="text-2xl font-mono font-bold text-green-400">--:--:--</div>
        <p class="text-slate-500 text-xs mt-1">（16時間目安）</p>
      </div>
      <div class="bg-slate-800 rounded-xl p-4 text-center">
        <p class="text-slate-400 text-xs mb-1">目標時間まで</p>
        <div id="goal-countdown" class="text-2xl font-mono font-bold text-amber-400">--:--:--</div>
        <div id="goal-label" class="text-slate-500 text-xs mt-1"></div>
      </div>
    </div>

    <div class="bg-slate-800 rounded-2xl p-4 mb-4">
      <div class="flex justify-between text-xs text-slate-400 mb-2">
        <span>開始</span>
        <span id="progress-label">0%</span>
        <span id="goal-time-label">目標</span>
      </div>
      <div class="relative h-6 bg-slate-700 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-teal-500 rounded-full transition-all duration-1000" style="width:0%"></div>
        <div id="auto-marker" class="absolute top-0 h-full w-0.5 bg-green-400" style="left:66.6%"></div>
      </div>
      <div class="flex justify-between text-xs text-slate-500 mt-1">
        <span>0h</span>
        <span class="text-green-400">16h ↑</span>
        <span id="goal-h-label">24h</span>
      </div>
    </div>

    <div id="status-box" class="rounded-xl p-3 text-center text-sm font-semibold"></div>
  </div>
</div>

<script>
let startTime = null;
let timer = null;
let goalHours = 16;

function updateMode() {
  goalHours = parseInt(document.getElementById('mode-select').value);
  document.getElementById('goal-h-label').textContent = goalHours + 'h';
  document.getElementById('goal-label').textContent = `（${goalHours}時間目標）`;
  const autoMarkerPct = Math.min(100, (16 / goalHours) * 100);
  document.getElementById('auto-marker').style.left = autoMarkerPct + '%';
  if (startTime) tick();
}

function startFast() {
  const val = document.getElementById('last-meal').value;
  if (!val) {
    const now = new Date();
    document.getElementById('last-meal').value = now.toISOString().slice(0, 16);
  }
  startTime = new Date(document.getElementById('last-meal').value).getTime();
  localStorage.setItem('fast_start', startTime);
  localStorage.setItem('fast_goal', goalHours);
  document.getElementById('display').classList.remove('hidden');
  if (timer) clearInterval(timer);
  timer = setInterval(tick, 1000);
  tick();
}

function stopFast() {
  if (timer) clearInterval(timer);
  startTime = null;
  localStorage.removeItem('fast_start');
  document.getElementById('display').classList.add('hidden');
  document.getElementById('last-meal').value = '';
}

function formatDur(ms) {
  if (ms < 0) return '完了！';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function tick() {
  if (!startTime) return;
  const now = Date.now();
  const elapsed = now - startTime;
  const elapsedH = elapsed / 3600000;

  document.getElementById('elapsed').textContent = formatDur(elapsed);

  const autoMs = 16 * 3600000 - elapsed;
  document.getElementById('auto-countdown').textContent = autoMs > 0 ? formatDur(autoMs) : '✓ 開始中';
  document.getElementById('auto-countdown').className = autoMs > 0
    ? 'text-2xl font-mono font-bold text-green-400'
    : 'text-2xl font-mono font-bold text-green-200';

  const goalMs = goalHours * 3600000 - elapsed;
  document.getElementById('goal-countdown').textContent = goalMs > 0 ? formatDur(goalMs) : '✓ 達成！';

  const pct = Math.min(100, (elapsedH / goalHours) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = pct.toFixed(1) + '%';
  document.getElementById('goal-time-label').textContent = goalHours + 'h';

  const statusBox = document.getElementById('status-box');
  if (elapsedH < 8) {
    statusBox.className = 'rounded-xl p-3 text-center text-sm font-semibold bg-slate-700 text-slate-300';
    statusBox.textContent = '📦 消化フェーズ：グリコーゲン消費中';
  } else if (elapsedH < 12) {
    statusBox.className = 'rounded-xl p-3 text-center text-sm font-semibold bg-blue-900 text-blue-200';
    statusBox.textContent = '🔥 脂肪燃焼フェーズ：ケトン体生成開始';
  } else if (elapsedH < 16) {
    statusBox.className = 'rounded-xl p-3 text-center text-sm font-semibold bg-teal-900 text-teal-200';
    statusBox.textContent = '⚡ ケトーシスフェーズ：脂肪酸積極利用中';
  } else if (elapsedH < 24) {
    statusBox.className = 'rounded-xl p-3 text-center text-sm font-semibold bg-green-900 text-green-200';
    statusBox.textContent = '♻️ オートファジーフェーズ：細胞の自己洗浄中';
  } else {
    statusBox.className = 'rounded-xl p-3 text-center text-sm font-semibold bg-purple-900 text-purple-200';
    statusBox.textContent = '🌟 深部断食フェーズ：幹細胞活性化';
  }
}

// Restore from localStorage
const saved = localStorage.getItem('fast_start');
const savedGoal = localStorage.getItem('fast_goal');
if (saved) {
  startTime = parseInt(saved);
  if (savedGoal) goalHours = parseInt(savedGoal);
  const dt = new Date(startTime);
  document.getElementById('last-meal').value = dt.toISOString().slice(0, 16);
  document.getElementById('mode-select').value = goalHours;
  document.getElementById('display').classList.remove('hidden');
  timer = setInterval(tick, 1000);
  tick();
}
updateMode();
</script>
</body>
</html>
